[package]
name = "dnrs"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = false
opt-level = 3
lto = true

[profile.dev]
debug = true
opt-level = 0
lto = false

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "unicode", "wrap_help"] }
dirs = "7.0.0"
lum_config = "0.4.0"
lum_libs = { version = "0.2.14", features = ["serde"] }
lum_log = "0.4.0"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.12"
tokio = { version = "1.53.1", features = ["full"] }
